[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "answer-generation-service"
version = "0.1.0"
description = "Policy-gated grounded answer generation for the Help Desk RAG system."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "rfc8785>=0.1,<1",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/answer_generation_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/answer_generation_service/infrastructure/outbound_policy/policy.yaml" = "answer_generation_service/infrastructure/outbound_policy/policy.yaml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running dependency or an opt-in live provider",
  "e2e: requires the Help Desk Docker stack",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.per-file-target-version]
"scripts/docker_smoke_test.py" = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/docker_smoke_test.py" = ["RUF001", "RUF002", "RUF003"]
"src/**/*.py" = ["RUF002", "RUF003"]
"src/answer_generation_service/infrastructure/llm/fake.py" = ["RUF001", "RUF002", "RUF003"]
"tests/**/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
files = ["src/answer_generation_service"]

[tool.coverage.run]
source = ["answer_generation_service"]
branch = true
