services:
  answer-generation-api:
    build:
      context: .
    image: helpdesk/answer-generation-service:local
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:-local-development-only}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-262144}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_PROVIDER_USAGE_MODE: ${LLM_PROVIDER_USAGE_MODE:-test}
      # External providers are opt-in. Fake Provider stays fully offline and is
      # allowed by the composition root without weakening this default.
      EXTERNAL_LLM_APPROVED: ${EXTERNAL_LLM_APPROVED:-false}
      LLM_MODEL: ${LLM_MODEL:-fake-grounded-v1}
      MAX_GENERATION_CONCURRENCY: ${MAX_GENERATION_CONCURRENCY:-2}
      MAX_GENERATION_QUEUE_SIZE: ${MAX_GENERATION_QUEUE_SIZE:-8}
      LLM_QUEUE_WAIT_TIMEOUT_SECONDS: ${LLM_QUEUE_WAIT_TIMEOUT_SECONDS:-10}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_MAX_RESPONSE_BYTES: ${LLM_MAX_RESPONSE_BYTES:-262144}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-60}
      LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-75}
      LLM_TOTAL_ATTEMPTS: ${LLM_TOTAL_ATTEMPTS:-2}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.5}
      LLM_RETRY_MAX_BACKOFF_SECONDS: ${LLM_RETRY_MAX_BACKOFF_SECONDS:-4}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      PROVIDER_ALLOWED_HOSTS: ${PROVIDER_ALLOWED_HOSTS:-["integrate.api.nvidia.com"]}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_ALLOWED_HOSTS: ${GROQ_ALLOWED_HOSTS:-["api.groq.com"]}
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-3000}
      MAX_PROMPT_TOKENS: ${MAX_PROMPT_TOKENS:-12000}
      MAX_ANSWER_CHARACTERS: ${MAX_ANSWER_CHARACTERS:-20000}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0}
      PROMPT_VERSION: ${PROMPT_VERSION:-grounded-answer-v1}
      # Compose 掛載 host policy；切換 enabled 後只需 restart，不必 rebuild image。
      OUTBOUND_POLICY_PATH: /run/config/outbound-policy.yaml
      ATTESTATION_PUBLIC_KEY_PATHS: ${ATTESTATION_PUBLIC_KEY_PATHS:-{"retrieval-dev-001":"/run/secrets/retrieval-attestation-public.pem"}}
      ATTESTATION_ACCEPTED_POLICY_VERSIONS: ${ATTESTATION_ACCEPTED_POLICY_VERSIONS:-["retrieval-policy-v1"]}
      ATTESTATION_POLICY_PROMPT_BINDINGS: ${ATTESTATION_POLICY_PROMPT_BINDINGS:-{"retrieval-policy-v1":["grounded-answer-v1"]}}
      ATTESTATION_ISSUER: retrieval-service
      ATTESTATION_AUDIENCE: answer-generation-service
      ATTESTATION_CONTEXT_SCHEMA_VERSION: retrieval-context-v1
      ATTESTATION_CLOCK_SKEW_SECONDS: ${ATTESTATION_CLOCK_SKEW_SECONDS:-30}
      ATTESTATION_MAX_LIFETIME_SECONDS: ${ATTESTATION_MAX_LIFETIME_SECONDS:-600}
    secrets:
      - source: retrieval-attestation-public
        target: retrieval-attestation-public.pem
    volumes:
      - ./src/answer_generation_service/infrastructure/outbound_policy/policy.yaml:/run/config/outbound-policy.yaml:ro
    ports:
      - "${ANSWER_GENERATION_BIND_ADDRESS:-127.0.0.1}:${ANSWER_GENERATION_API_PORT:-8110}:8110"

networks:
  default:
    name: ${HELPDESK_NETWORK:-helpdesk-rag}
    external: true

secrets:
  # 正式環境應由部署主機提供 public key，不要把 production key 包進 image。
  retrieval-attestation-public:
    file: ${RETRIEVAL_ATTESTATION_PUBLIC_KEY_FILE:-../retrieval-service/secrets/dev/retrieval-public.pem}
