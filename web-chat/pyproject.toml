[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "web-chat"
version = "0.1.0"
description = "Local no-login demo web client for the Help Desk Chat Service."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/web_chat"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=web_chat --cov-branch --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "ui: browser-facing static and interaction contract tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["RUF002", "RUF003"]
"tests/**/*.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/docker_smoke_test.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
files = ["src/web_chat"]

[tool.coverage.run]
source = ["web_chat"]
branch = true
