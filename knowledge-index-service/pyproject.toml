[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "knowledge-index-service"
version = "0.1.0"
description = "Metadata registry, embedding and vector index service for the Help Desk knowledge base."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "prometheus-client>=0.20,<1",
  "pydantic-settings>=2.5,<3",
  "qdrant-client==1.18.0",
  "sentence-transformers>=3.3,<6",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "structlog>=24.4,<26",
  # Linux containers must use the CPU wheel. Keeping torch as a direct,
  # platform-qualified dependency prevents sentence-transformers from
  # silently selecting PyPI's CUDA-enabled Linux build.
  "torch==2.11.0+cpu; sys_platform == 'linux'",
  "torch==2.11.0; sys_platform != 'linux'",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.32,<1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "testcontainers[postgres]>=4.9,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_index_service"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires external infrastructure or a real model",
  "e2e: requires the complete Docker Compose stack",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.per-file-target-version]
"scripts/docker_smoke_test.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/docker_smoke_test.py" = ["RUF001", "UP007", "UP045"]
# Production code intentionally contains Traditional Chinese teaching comments/docstrings.
"src/**/*.py" = ["RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["knowledge_index_service"]

[tool.coverage.run]
source = ["knowledge_index_service"]
branch = true
