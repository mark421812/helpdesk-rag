<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 僅供 bundled headless renderer；不修改使用者或系統的字型設定。 -->
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/System/Library/Fonts</dir>
  <cachedir>/private/tmp/helpdesk-u0-fontconfig-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>Arial Unicode MS</family></prefer></alias>
</fontconfig>
